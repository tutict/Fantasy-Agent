$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://fantasy-agent.local/schemas/gameplay-schema.yaml"
title: "Fantasy Agent Gameplay DSL"
type: object
additionalProperties: false
required:
  - schema_version
  - title
  - logline
  - target_session_minutes
  - player_fantasy
  - design_pillars
  - core_verbs
  - core_loop
  - systems
  - progression
  - win_state
  - failure_states
  - level_beats
  - asset_needs
  - qa_focus
  - notes_for_unreal
  - notes_for_blender
  - notes_for_comfyui
properties:
  schema_version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+$"
  title:
    type: string
    minLength: 3
  logline:
    type: string
    minLength: 20
  target_session_minutes:
    type: integer
    minimum: 5
    maximum: 15
  player_fantasy:
    type: string
    minLength: 10
  design_pillars:
    type: array
    minItems: 3
    maxItems: 5
    items:
      type: string
      minLength: 5
  core_verbs:
    type: array
    minItems: 3
    items:
      type: string
      minLength: 2
  core_loop:
    type: array
    minItems: 3
    items:
      $ref: "#/$defs/loop_step"
  systems:
    type: array
    minItems: 3
    items:
      $ref: "#/$defs/system_spec"
  progression:
    $ref: "#/$defs/progression"
  win_state:
    type: string
    minLength: 10
  failure_states:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 5
  level_beats:
    type: array
    minItems: 2
    items:
      $ref: "#/$defs/level_beat"
  asset_needs:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 3
  qa_focus:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 8
  notes_for_unreal:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 8
  notes_for_blender:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 8
  notes_for_comfyui:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 8
  enemies:
    type: array
    default: []
    items:
      $ref: "#/$defs/enemy_spec"
  i18n:
    $ref: "#/$defs/i18n_bundle"
  mcp_handoffs:
    type: array
    items:
      $ref: "#/$defs/mcp_handoff"
$defs:
  loop_step:
    type: object
    additionalProperties: false
    required:
      - order
      - action
      - player_decision
      - feedback
    properties:
      order:
        type: integer
        minimum: 1
      action:
        type: string
        minLength: 3
      player_decision:
        type: string
        minLength: 8
      feedback:
        type: string
        minLength: 8
  system_spec:
    type: object
    additionalProperties: false
    required:
      - name
      - purpose
      - inputs
      - outputs
      - failure_pressure
    properties:
      name:
        type: string
        minLength: 3
      purpose:
        type: string
        minLength: 10
      inputs:
        type: array
        minItems: 1
        items:
          type: string
      outputs:
        type: array
        minItems: 1
        items:
          type: string
      failure_pressure:
        type: string
        minLength: 8
  progression:
    type: object
    additionalProperties: false
    required:
      - first_minute
      - midpoint_shift
      - final_minutes
      - unlocks
    properties:
      first_minute:
        type: string
        minLength: 8
      midpoint_shift:
        type: string
        minLength: 8
      final_minutes:
        type: string
        minLength: 8
      unlocks:
        type: array
        items:
          type: string
  level_beat:
    type: object
    additionalProperties: false
    required:
      - name
      - duration_minutes
      - gameplay_focus
      - required_assets
      - success_condition
    properties:
      name:
        type: string
        minLength: 3
      duration_minutes:
        type: integer
        minimum: 1
        maximum: 15
      gameplay_focus:
        type: string
        minLength: 8
      required_assets:
        type: array
        minItems: 1
        items:
          type: string
      success_condition:
        type: string
        minLength: 8
  enemy_spec:
    type: object
    additionalProperties: false
    required:
      - name
      - behavior
      - hp
      - count
    properties:
      name:
        type: string
        minLength: 3
      behavior:
        enum:
          - patrol
          - chase
          - stationary
          - ranged
      hp:
        type: integer
        minimum: 1
      count:
        type: integer
        minimum: 1
        maximum: 12
  mcp_handoff:
    type: object
    additionalProperties: false
    required:
      - server
      - tool
      - input_artifact
      - output_artifact
      - safety_checks
    properties:
      server:
        enum:
          - unreal-mcp
          - blender-mcp
          - comfyui-mcp
          - godot-mcp
          - github-mcp
      tool:
        type: string
      input_artifact:
        type: string
      output_artifact:
        type: string
      safety_checks:
        type: array
        minItems: 1
        items:
          type: string
  unreal_project_plan:
    type: object
    additionalProperties: false
    required:
      - project_name
      - engine_version
      - template
      - plugins
      - folders
      - gameplay_classes
      - blueprints
      - maps
      - automation_steps
      - handoff_artifacts
    properties:
      project_name:
        type: string
      engine_version:
        type: string
      template:
        enum:
          - blank
          - third-person
          - top-down
          - first-person
      plugins:
        type: array
        items:
          type: string
      folders:
        type: array
        minItems: 1
        items:
          type: string
      gameplay_classes:
        type: array
        items:
          type: string
      blueprints:
        type: array
        items:
          type: string
      maps:
        type: array
        minItems: 1
        items:
          type: string
      automation_steps:
        type: array
        minItems: 1
        items:
          type: string
      handoff_artifacts:
        type: array
        items:
          type: string
  godot_project_plan:
    type: object
    additionalProperties: false
    required:
      - project_name
      - engine_version
      - renderer
      - folders
      - scenes
      - scripts
      - input_actions
      - automation_steps
      - handoff_artifacts
    properties:
      project_name:
        type: string
      engine_version:
        type: string
        default: "Godot 4"
      renderer:
        enum:
          - Forward+
          - Mobile
          - Compatibility
      folders:
        type: array
        minItems: 1
        items:
          type: string
      scenes:
        type: array
        minItems: 1
        items:
          type: string
      scripts:
        type: array
        minItems: 1
        items:
          type: string
      input_actions:
        type: array
        items:
          type: string
      automation_steps:
        type: array
        minItems: 1
        items:
          type: string
      handoff_artifacts:
        type: array
        items:
          type: string
  blender_asset_plan:
    type: object
    additionalProperties: false
    required:
      - job_name
      - scene_units
      - jobs
      - python_entrypoint
      - export_format
      - handoff_artifacts
    properties:
      job_name:
        type: string
      scene_units:
        enum:
          - centimeters
          - meters
      jobs:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/blender_asset_job"
      python_entrypoint:
        type: string
      export_format:
        enum:
          - fbx
          - glb
      handoff_artifacts:
        type: array
        items:
          type: string
  blender_asset_job:
    type: object
    additionalProperties: false
    required:
      - asset_name
      - purpose
      - primitive_strategy
      - export_path
      - collision_hint
    properties:
      asset_name:
        type: string
      purpose:
        type: string
      primitive_strategy:
        type: string
      export_path:
        type: string
      collision_hint:
        type: string
      asset_kind:
        enum:
          - modular_wall
          - door
          - ramp
          - hazard_marker
          - objective_prop
          - exit_gate
          - ui_proxy_mesh
          - generic_greybox
      dimensions_cm:
        type: array
        minItems: 3
        maxItems: 3
        items:
          type: number
      material_key:
        enum:
          - neutral
          - safe
          - hazard
          - objective
          - exit
          - ui
          - door
          - ramp
      collection:
        type: string
      unreal_path:
        type: string
      collision_name:
        type: string
  comfyui_visual_plan:
    type: object
    additionalProperties: false
    required:
      - plan_name
      - endpoint
      - jobs
      - workflow_templates
      - handoff_artifacts
      - usage_rules
    properties:
      plan_name:
        type: string
      endpoint:
        type: string
        default: "http://127.0.0.1:8188"
      checkpoint_name:
        type:
          - string
          - "null"
        description: "可选 ComfyUI checkpoint 模型名。未设置时，MCP 执行会探测本地 checkpoint；如果没有可用模型则阻塞。"
      jobs:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/comfyui_prompt_job"
      workflow_templates:
        type: array
        minItems: 1
        items:
          type: string
      handoff_artifacts:
        type: array
        items:
          type: string
      usage_rules:
        type: array
        minItems: 1
        items:
          type: string
  comfyui_prompt_job:
    type: object
    additionalProperties: false
    required:
      - job_id
      - purpose
      - prompt
      - negative_prompt
      - workflow_template
      - output_path
      - gameplay_constraint
    properties:
      job_id:
        type: string
      purpose:
        enum:
          - concept_reference
          - material_reference
          - ui_reference
          - texture_seed
          - storyboard_frame
      prompt:
        type: string
      negative_prompt:
        type: string
      workflow_template:
        type: string
      output_path:
        type: string
      gameplay_constraint:
        type: string
  director_task_breakdown:
    type: object
    additionalProperties: false
    required:
      - source
      - schema_version
      - source_prompt
      - goal
      - tasks
      - recommended_next_task
      - risks
      - next_actions
      - confirmation_required
    properties:
      source:
        type: string
        default: director-agent
      schema_version:
        type: string
        default: "0.1"
      source_prompt:
        type: string
      goal:
        type: string
      goal_i18n:
        type: object
        additionalProperties:
          type: string
      tasks:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/production_task"
      recommended_next_task:
        type: string
      risks:
        type: array
        items:
          type: string
      next_actions:
        type: array
        items:
          type: string
      confirmation_required:
        type: boolean
      i18n:
        $ref: "#/$defs/i18n_bundle"
  production_task:
    type: object
    additionalProperties: false
    required:
      - id
      - title
      - agent
      - purpose
      - inputs
      - outputs
      - side_effects
      - depends_on
      - artifacts
      - status
      - requires_confirmation
      - risks
    properties:
      id:
        type: string
      title:
        type: string
      title_i18n:
        type: object
        additionalProperties:
          type: string
      agent:
        enum:
          - director-agent
          - gameplay-agent
          - gdd-writer
          - level-director
          - blender-worker
          - comfyui-worker
          - godot-builder
          - unreal-builder
          - qa-agent
      purpose:
        type: string
      inputs:
        type: array
        items:
          type: string
      outputs:
        type: array
        items:
          type: string
      side_effects:
        type: array
        items:
          type: string
      depends_on:
        type: array
        items:
          type: string
      artifacts:
        type: array
        items:
          type: string
      status:
        enum:
          - pending
          - ready
          - blocked
          - done
      requires_confirmation:
        type: boolean
      risks:
        type: array
        items:
          type: string

  production_spec_bundle:
    type: object
    additionalProperties: false
    required:
      - source
      - schema_version
      - gameplay_spec_title
      - level
      - numeric
      - narrative
      - config_tables
      - resource_pipeline
      - handoff_artifacts
    properties:
      source:
        type: string
        default: fantasy-agent.production-specs
      schema_version:
        type: string
        default: "0.1"
      gameplay_spec_title:
        type: string
      combat:
        anyOf:
          - $ref: "#/$defs/combat_spec"
          - type: "null"
      level:
        $ref: "#/$defs/level_spec"
      numeric:
        $ref: "#/$defs/numeric_tuning_spec"
      narrative:
        $ref: "#/$defs/narrative_spec"
      config_tables:
        $ref: "#/$defs/config_table_spec"
      resource_pipeline:
        $ref: "#/$defs/resource_pipeline_spec"
      validation:
        anyOf:
          - $ref: "#/$defs/spec_validation_report"
          - type: "null"
      handoff_artifacts:
        type: array
        items:
          type: string
  combat_spec:
    type: object
    additionalProperties: false
    required:
      - source
      - schema_version
      - encounters
      - enemy_roles
      - damage_model
      - failure_pressure
      - telegraphs
      - player_counterplay
    properties:
      source:
        type: string
      schema_version:
        type: string
      encounters:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/combat_encounter_spec"
      enemy_roles:
        type: array
        minItems: 1
        items:
          type: string
      damage_model:
        $ref: "#/$defs/damage_model"
      failure_pressure:
        type: string
        minLength: 1
      telegraphs:
        type: array
        minItems: 1
        items:
          type: string
      player_counterplay:
        type: array
        minItems: 1
        items:
          type: string
  combat_encounter_spec:
    type: object
    additionalProperties: false
    required:
      - encounter_id
      - beat
      - enemy_roles
      - pressure_goal
      - telegraphs
      - player_counterplay
    properties:
      encounter_id:
        type: string
      beat:
        type: string
      enemy_roles:
        type: array
        minItems: 1
        items:
          type: string
      pressure_goal:
        type: string
      telegraphs:
        type: array
        minItems: 1
        items:
          type: string
      player_counterplay:
        type: array
        minItems: 1
        items:
          type: string
  damage_model:
    type: object
    additionalProperties: false
    properties:
      player_hp:
        type: integer
        minimum: 1
        maximum: 999
      enemy_hp_default:
        type: integer
        minimum: 1
        maximum: 100
      contact_damage:
        type: integer
        minimum: 0
        maximum: 100
      ranged_damage:
        type: integer
        minimum: 0
        maximum: 100
      recovery_seconds:
        type: number
        minimum: 0
        maximum: 30
  level_spec:
    type: object
    additionalProperties: false
    required:
      - teaching_segment
      - final_test
      - objective_gates
    properties:
      source:
        type: string
      schema_version:
        type: string
      teaching_segment:
        $ref: "#/$defs/level_segment_spec"
      mid_segments:
        type: array
        items:
          $ref: "#/$defs/level_segment_spec"
      final_test:
        $ref: "#/$defs/level_segment_spec"
      spawn_zones:
        type: array
        items:
          type: string
      safe_zones:
        type: array
        items:
          type: string
      objective_gates:
        type: array
        minItems: 1
        items:
          type: string
      hazard_rules:
        type: array
        items:
          type: string
      encounter_placement_rules:
        type: array
        items:
          type: string
  level_segment_spec:
    type: object
    additionalProperties: false
    required:
      - name
      - duration_minutes
      - gameplay_focus
      - spawn_zone
      - safe_zone
      - objective_gate
      - placement_rules
    properties:
      name:
        type: string
      duration_minutes:
        type: integer
        minimum: 1
        maximum: 15
      gameplay_focus:
        type: string
      spawn_zone:
        type: string
      safe_zone:
        type: string
      objective_gate:
        type: string
      placement_rules:
        type: array
        minItems: 1
        items:
          type: string
  numeric_tuning_spec:
    type: object
    additionalProperties: false
    required:
      - target_session_minutes
      - pressure_clock_seconds
      - enemy_pressure
    properties:
      source:
        type: string
      schema_version:
        type: string
      player_move_speed:
        type: number
        minimum: 1
        maximum: 40
      player_hp:
        type: integer
        minimum: 1
        maximum: 999
      target_session_minutes:
        type: integer
        minimum: 5
        maximum: 15
      pressure_clock_seconds:
        type: integer
        minimum: 60
        maximum: 1800
      enemy_pressure:
        $ref: "#/$defs/enemy_pressure_tuning"
      resource_costs:
        type: object
        additionalProperties:
          type: number
      tuning_bounds:
        type: object
      qa_risks:
        type: array
        items:
          type: string
  enemy_pressure_tuning:
    type: object
    additionalProperties: false
    properties:
      enemy_count_multiplier:
        type: number
        minimum: 0
        maximum: 3
      move_speed_multiplier:
        type: number
        minimum: 0.25
        maximum: 3
      detection_radius_multiplier:
        type: number
        minimum: 0.25
        maximum: 3
      patrol_radius_multiplier:
        type: number
        minimum: 0.25
        maximum: 3
      ranged_interval_multiplier:
        type: number
        minimum: 0.25
        maximum: 3
  narrative_spec:
    type: object
    additionalProperties: false
    required:
      - player_fantasy
      - premise
      - beats
      - objective_copy
      - failure_feedback
    properties:
      source:
        type: string
      schema_version:
        type: string
      player_fantasy:
        type: string
      premise:
        type: string
      beats:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/narrative_beat_spec"
      objective_copy:
        type: array
        minItems: 1
        items:
          type: string
      failure_feedback:
        type: array
        minItems: 1
        items:
          type: string
      hud_text:
        type: object
        additionalProperties:
          type: string
      gameplay_priority_rule:
        type: string
  narrative_beat_spec:
    type: object
    additionalProperties: false
    required:
      - beat_id
      - level_beat
      - player_goal
      - objective_copy
      - failure_feedback
    properties:
      beat_id:
        type: string
      level_beat:
        type: string
      player_goal:
        type: string
      objective_copy:
        type: string
      failure_feedback:
        type: string
  config_table_spec:
    type: object
    additionalProperties: false
    required:
      - tables
    properties:
      source:
        type: string
      schema_version:
        type: string
      tables:
        type: array
        items:
          $ref: "#/$defs/config_table"
      handoff_artifacts:
        type: array
        items:
          type: string
  config_table:
    type: object
    additionalProperties: false
    required:
      - table_id
      - format
      - primary_key
      - rows
      - export_path
    properties:
      table_id:
        type: string
      format:
        enum:
          - yaml
          - json
          - csv-ready
      primary_key:
        type: string
      rows:
        type: array
        items:
          type: object
      export_path:
        type: string
  resource_pipeline_spec:
    type: object
    additionalProperties: false
    required:
      - assets
      - approval_manifest_path
      - ingest_rules
      - blocked_assets
    properties:
      source:
        type: string
      schema_version:
        type: string
      assets:
        type: array
        items:
          $ref: "#/$defs/resource_pipeline_asset"
      approval_manifest_path:
        type: string
      ingest_rules:
        type: array
        items:
          type: string
      blocked_assets:
        type: array
        items:
          type: string
  resource_pipeline_asset:
    type: object
    additionalProperties: false
    required:
      - asset_id
      - source
      - role
      - approval_status
      - engine_destination
    properties:
      asset_id:
        type: string
      source:
        enum:
          - blender
          - comfyui
      role:
        type: string
      approval_status:
        enum:
          - pending_user_review
          - approved
          - needs_revision
          - rejected
      engine_destination:
        type: string
        minLength: 1
      blocked_reason:
        type:
          - string
          - "null"
  spec_validation_report:
    type: object
    additionalProperties: false
    required:
      - source
      - schema_version
      - status
      - issues
      - coverage
    properties:
      source:
        type: string
      schema_version:
        type: string
      status:
        enum:
          - passed
          - warning
          - failed
      issues:
        type: array
        items:
          type: object
      coverage:
        type: object
        additionalProperties:
          type: boolean
  compiled_spec_artifact:
    type: object
    additionalProperties: false
    required:
      - path
      - media_type
      - content
    properties:
      path:
        type: string
        minLength: 1
      media_type:
        type: string
        minLength: 1
      content:
        type: string
  spec_trace_record:
    type: object
    additionalProperties: false
    required:
      - spec_field
      - artifact_path
      - consumer
    properties:
      spec_field:
        type: string
        minLength: 1
      artifact_path:
        type: string
        minLength: 1
      consumer:
        type: string
        minLength: 1
  spec_compile_result:
    type: object
    additionalProperties: false
    required:
      - target
      - artifacts
      - traces
    properties:
      target:
        enum:
          - godot
          - unreal
      artifacts:
        type: array
        items:
          $ref: "#/$defs/compiled_spec_artifact"
      traces:
        type: array
        items:
          $ref: "#/$defs/spec_trace_record"
  executable_qa_assertion:
    type: object
    additionalProperties: false
    required:
      - assertion_id
      - metric_key
      - operator
      - severity
    properties:
      assertion_id:
        type: string
        minLength: 1
      metric_key:
        type: string
        minLength: 1
      operator:
        enum:
          - eq
          - gte
          - lte
          - between
          - non_empty
          - all_approved
      expected: {}
      severity:
        enum:
          - error
          - warning
  executable_qa_result:
    type: object
    additionalProperties: false
    required:
      - assertion_id
      - metric_key
      - passed
      - actual
      - severity
      - message
    properties:
      assertion_id:
        type: string
      metric_key:
        type: string
      passed:
        type: boolean
      actual: {}
      expected: {}
      severity:
        enum:
          - error
          - warning
      message:
        type: string
  executable_qa_report:
    type: object
    additionalProperties: false
    required:
      - source
      - schema_version
      - status
      - assertions
      - results
    properties:
      source:
        type: string
      schema_version:
        type: string
      status:
        enum:
          - passed
          - warning
          - failed
      assertions:
        type: array
        items:
          $ref: "#/$defs/executable_qa_assertion"
      results:
        type: array
        items:
          $ref: "#/$defs/executable_qa_result"
  i18n_bundle:
    type: object
    additionalProperties: false
    required:
      - source_locale
      - output_locales
      - field_translations
      - term_translations
    properties:
      source_locale:
        $ref: "#/$defs/locale_code"
      output_locales:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/locale_code"
      field_translations:
        type: object
        description: "按字段路径保存的翻译，例如 core_loop.0.action。"
        additionalProperties:
          $ref: "#/$defs/localized_string"
      term_translations:
        type: object
        description: "用于 UI、文档和生成资产的可复用术语表。"
        additionalProperties:
          $ref: "#/$defs/localized_string"
  localized_string:
    type: object
    additionalProperties: false
    minProperties: 1
    properties:
      en:
        type: string
      zh-CN:
        type: string
  locale_code:
    enum:
      - en
      - zh-CN
