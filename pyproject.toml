[project]
name = "fantasy-agent"
version = "0.1.0"
description = "An AI-native single-process local game production workbench."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141",
    "pydantic>=2.13",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.52"
]

[project.optional-dependencies]
orchestration = [
    "langgraph>=0.2"
]
llm = [
    "anthropic>=0.40"
]
dev = [
    "pytest>=9.1",
    "ruff>=0.16"
]

[project.scripts]
fantasy-agent = "fantasy_agent.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py311"

# ruff 0.16 起默认规则集大幅扩张（新增 I001 / DTZ005 / S110 / PLR0402 / UP03x /
# BLE001 等 20 余条），仓库会在零代码改动的情况下由全绿变 63 条告警。这里显式
# 声明规则集，让 lint 结果只随代码变化、不随 ruff 版本漂移；要采纳新规则请单独
# 开一轮并逐条修（其中 DTZ005 / S110 / BLE001 与项目"拒绝静默降级"的约定相关）。
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["fantasy_agent*"]
exclude = ["apps*", "docs*", "examples*", "generated*", "legacy*", "locales*", "mcp*", "skills*", "templates*", "tests*"]
