[project]
name = "fantasy-agent"
version = "0.1.0"
description = "An AI-native multi-agent game production platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.30"
]

[project.optional-dependencies]
orchestration = [
    "langgraph>=0.2"
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["fantasy_agent*"]
exclude = ["apps*", "docs*", "examples*", "generated*", "legacy*", "locales*", "mcp*", "skills*", "templates*", "tests*"]
