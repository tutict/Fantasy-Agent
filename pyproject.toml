[project]
name = "fantasy-agent"
version = "0.1.0"
description = "An AI-native single-process local game production workbench."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141",
    "pydantic>=2.13",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.52"
]

[project.optional-dependencies]
orchestration = [
    "langgraph>=0.2"
]
llm = [
    "anthropic>=0.40"
]
dev = [
    "pytest>=9.1",
    "ruff>=0.16"
]

[project.scripts]
fantasy-agent = "fantasy_agent.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py311"

# Lint deliberately follows ruff's default rule set instead of pinning a
# whitelist: when a new ruff release enables a rule, CI goes red and the rule
# gets read and adopted. An earlier `select = ["E4", "E7", "E9", "F"]` pin was
# removed after it turned a 63-warning tree green while silently skipping those
# rules -- that is the failure mode this comment exists to prevent.
#
# A rule that genuinely does not apply gets ignored at the site with a reason
# (`# noqa: CODE - why`), the way the broad `except Exception` handlers in
# fantasy_agent/ already carry `# noqa: BLE001 - <reason>`.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["fantasy_agent*"]
exclude = ["apps*", "docs*", "examples*", "generated*", "legacy*", "locales*", "mcp*", "skills*", "templates*", "tests*"]
