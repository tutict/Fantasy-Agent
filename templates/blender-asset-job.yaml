job_name: prototype-greybox-pass
scene_units: centimeters
export_format: fbx
jobs:
  - asset_name: modular_wall_400
    asset_kind: modular_wall
    purpose: "用于路线阻挡和视线测试的可复用模块化墙体。"
    primitive_strategy: "比例正确的立方体墙，并带有可读性边线。"
    export_path: generated/assets/modular_wall_400.fbx
    collision_hint: "生成与边界匹配的 UCX convex collision。"
    dimensions_cm: [400, 30, 300]
    material_key: neutral
    collection: FA_Modular_Walls
    unreal_path: /Game/Art/Generated
    collision_name: UCX_modular_wall_400_00
  - asset_name: interaction_door
    asset_kind: door
    purpose: "用于路线变化和锁钥测试的可读门。"
    primitive_strategy: "门板加简单门框组件。"
    export_path: generated/assets/interaction_door.fbx
    collision_hint: "生成与边界匹配的 UCX convex collision。"
    dimensions_cm: [160, 24, 260]
    material_key: door
    collection: FA_Doors
    unreal_path: /Game/Art/Generated
    collision_name: UCX_interaction_door_00
  - asset_name: traversal_ramp
    asset_kind: ramp
    purpose: "用于垂直路线可读性的简单坡道。"
    primitive_strategy: "三棱柱坡道，并带有边缘可读性标记。"
    export_path: generated/assets/traversal_ramp.fbx
    collision_hint: "生成与边界匹配的 UCX convex collision。"
    dimensions_cm: [300, 220, 120]
    material_key: ramp
    collection: FA_Ramps
    unreal_path: /Game/Art/Generated
    collision_name: UCX_traversal_ramp_00
  - asset_name: hazard_marker
    asset_kind: hazard_marker
    purpose: "用于压力和失败反馈的可读危险标记。"
    primitive_strategy: "低多边形锥体加底板。"
    export_path: generated/assets/hazard_marker.fbx
    collision_hint: "生成与边界匹配的 UCX convex collision。"
    dimensions_cm: [110, 110, 130]
    material_key: hazard
    collection: FA_Hazards
    unreal_path: /Game/Art/Generated
    collision_name: UCX_hazard_marker_00
  - asset_name: objective_prop
    asset_kind: objective_prop
    purpose: "用于互动测试的可读目标 actor。"
    primitive_strategy: "圆柱底座加信标立方体。"
    export_path: generated/assets/objective_prop.fbx
    collision_hint: "生成与边界匹配的 UCX convex collision。"
    dimensions_cm: [120, 120, 170]
    material_key: objective
    collection: FA_Objectives
    unreal_path: /Game/Art/Generated
    collision_name: UCX_objective_prop_00
  - asset_name: exit_gate
    asset_kind: exit_gate
    purpose: "用于胜利状态测试的可读出口门。"
    primitive_strategy: "两根立柱、顶部横梁和 trigger plane。"
    export_path: generated/assets/exit_gate.fbx
    collision_hint: "生成与边界匹配的 UCX convex collision。"
    dimensions_cm: [240, 40, 300]
    material_key: exit
    collection: FA_Exits
    unreal_path: /Game/Art/Generated
    collision_name: UCX_exit_gate_00
  - asset_name: ui_proxy_mesh
    asset_kind: ui_proxy_mesh
    purpose: "用于目标和压力可读性的世界空间 UI proxy。"
    primitive_strategy: "薄面板加目标槽和压力槽。"
    export_path: generated/assets/ui_proxy_mesh.fbx
    collision_hint: "生成与边界匹配的 UCX convex collision。"
    dimensions_cm: [190, 6, 110]
    material_key: ui
    collection: FA_UI_Proxies
    unreal_path: /Game/Art/Generated
    collision_name: UCX_ui_proxy_mesh_00
