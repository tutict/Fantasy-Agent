name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes older runs irrelevant; cancel them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check fantasy_agent tests apps scripts

      - name: Pytest
        run: python -m pytest -q

      # The guards above are only worth having if they would go red when the
      # behaviour they describe is removed. Each case mutates a source file,
      # runs one guard, and requires that guard to fail; sources are restored
      # byte-for-byte. Cases whose guard launches a local engine report as not
      # applicable here (no engine on the runner) rather than failing, so this
      # step covers everything except the two Godot cases.
      - name: Mutation guards
        run: python scripts/mutation_check_all_guards.py

  frontend:
    name: Frontend (typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run frontend:typecheck

      - name: Test
        run: npm run frontend:test

      - name: Build
        run: npm run frontend:build
