server: unreal-mcp
tools:
  create_project_structure:
    description: "从 UnrealProjectPlan 准备或写入 UE project descriptor、内容目录、setup script 和 content manifest。"
    input:
      type: object
      properties:
        plan:
          $ref: "../../gameplay-schema.yaml#/$defs/unreal_project_plan"
        plan_path:
          type: string
          description: "未提供 plan 时可选的生成 YAML/JSON UnrealProjectPlan 路径。"
        project_dir:
          type: string
          default: "generated/unreal/<project-name>"
        content_manifest_path:
          type: string
          default: "generated/unreal/<project-name>/fantasy-agent-content-manifest.json"
        import_manifest_paths:
          type: array
          items:
            type: string
        write_files:
          type: boolean
          default: false
    output:
      type: object
      required:
        - status
        - artifact
        - manifest
        - created_paths
      properties:
        status:
          enum:
            - planned
            - written
        artifact:
          type: object
        manifest:
          type: object
        created_paths:
          type: array
          items:
            type: string
        written_files:
          type: array
          items:
            type: string
        risks:
          type: array
          items:
            type: string
    safety:
      - "除非 write_files 为 true，否则此工具只读。"
      - "工程目录必须保持在 generated/unreal。"
      - "内容目录必须以 Content/ 开头。"
      - "Import manifest 必须保持在 generated/。"
  prepare_asset_ingest:
    description: "为 Blender mesh 导出和已审阅的 ComfyUI 参考图准备 Unreal Python 导入自动化。"
    input:
      type: object
      required:
        - project_file
      properties:
        project_file:
          type: string
          description: "位于 generated/unreal 下的生成 .uproject 路径。"
        blender_import_manifest_path:
          type: string
          description: "位于 generated/ 下的可选 Blender Unreal import manifest。"
        comfyui_run_manifest_path:
          type: string
          description: "位于 generated/comfyui 下的可选 ComfyUI run manifest。"
        import_script_path:
          type: string
          default: "generated/unreal/<project>/Scripts/fantasy_agent_asset_ingest.py"
        ingest_manifest_path:
          type: string
          default: "generated/unreal/<project>/fantasy-agent-asset-ingest.json"
        write_files:
          type: boolean
          default: false
        require_existing_sources:
          type: boolean
          default: false
    output:
      type: object
      required:
        - status
        - manifest
      properties:
        status:
          enum:
            - planned
            - written
        manifest:
          type: object
        written_files:
          type: array
          items:
            type: string
        risks:
          type: array
          items:
            type: string
    safety:
      - "除非 write_files 为 true，否则此工具只读。"
      - "工程文件必须保持在 generated/unreal，并以 .uproject 结尾。"
      - "Blender 源资产必须保持在 generated/assets。"
      - "ComfyUI 源图片必须保持在 generated/comfyui。"
      - "ComfyUI 图片默认作为审阅参考导入。"
  run_asset_ingest:
    description: "启动 Unreal Editor 执行生成的 Fantasy Agent asset ingest 脚本。"
    input:
      type: object
      required:
        - project_file
        - import_script_path
      properties:
        project_file:
          type: string
          description: "位于 generated/unreal 下的生成 .uproject 路径。"
        import_script_path:
          type: string
          description: "位于 generated/unreal 下的生成 Python 脚本。"
        unreal_editor_cmd:
          type: string
          default: "UnrealEditor-Cmd"
        timeout_seconds:
          type: integer
          minimum: 30
          maximum: 3600
          default: 600
        confirmed_side_effects:
          type: boolean
          description: "用户明确确认后必须为 true。"
    output:
      type: object
      required:
        - status
        - log_paths
      properties:
        status:
          enum:
            - executed
            - failed
            - blocked
        command:
          type: array
          items:
            type: string
        log_paths:
          type: array
          items:
            type: string
        return_code:
          type: integer
        stdout_tail:
          type: string
        stderr_tail:
          type: string
        risks:
          type: array
          items:
            type: string
    safety:
      - "启动 Unreal 前必须设置 confirmed_side_effects。"
      - "工程文件必须保持在 generated/unreal，并以 .uproject 结尾。"
      - "导入脚本必须保持在 generated/unreal。"
      - "日志必须保存到 generated/logs/unreal。"
  validate_asset_ingest:
    description: "只读校验生成的 Unreal asset ingest manifest、源路径、Unreal 资产名和 UCX 碰撞命名。"
    input:
      type: object
      required:
        - ingest_manifest_path
      properties:
        ingest_manifest_path:
          type: string
          description: "位于 generated/unreal 下的生成 asset ingest manifest。"
        require_existing_sources:
          type: boolean
          default: true
    output:
      type: object
      required:
        - status
        - validation_report
      properties:
        status:
          enum:
            - executed
            - failed
        manifest:
          type: object
        validation_report:
          type: object
          properties:
            ingest_manifest_path:
              type: string
            project_file:
              type: string
            job_count:
              type: integer
            issues:
              type: array
              items:
                type: string
            warnings:
              type: array
              items:
                type: string
        risks:
          type: array
          items:
            type: string
    safety:
      - "此工具不会启动 Unreal。"
      - "Ingest manifest 必须保持在 generated/unreal。"
      - "Blender 源文件必须保持在 generated/assets。"
      - "ComfyUI 源文件必须保持在 generated/comfyui。"
      - "Static mesh 的 UCX 碰撞名称必须匹配 Unreal 资产名。"
  prepare_level_assembly:
    description: "从生成的 asset ingest manifest 准备玩法优先的灰盒地图组装 manifest 和 Unreal Python 脚本。"
    input:
      type: object
      required:
        - project_file
        - ingest_manifest_path
      properties:
        project_file:
          type: string
          description: "位于 generated/unreal 下的生成 .uproject 路径。"
        ingest_manifest_path:
          type: string
          description: "位于 generated/unreal 下的生成 asset ingest manifest。"
        map_name:
          type: string
          default: "M_Prototype_Greybox"
        assembly_script_path:
          type: string
          default: "generated/unreal/<project>/Scripts/fantasy_agent_level_assembly.py"
        level_manifest_path:
          type: string
          default: "generated/unreal/<project>/fantasy-agent-level-assembly.json"
        write_files:
          type: boolean
          default: false
    output:
      type: object
      required:
        - status
        - manifest
      properties:
        status:
          enum:
            - planned
            - written
        manifest:
          type: object
        written_files:
          type: array
          items:
            type: string
        risks:
          type: array
          items:
            type: string
    safety:
      - "除非 write_files 为 true，否则此工具只读。"
      - "工程文件必须保持在 generated/unreal，并以 .uproject 结尾。"
      - "Level manifest 和脚本必须保持在 generated/unreal。"
      - "地图路径必须保持在 /Game/Maps。"
  validate_level_assembly:
    description: "只读校验生成的 Unreal level assembly manifest、路线角色、地图路径和已导入资产引用。"
    input:
      type: object
      required:
        - level_manifest_path
      properties:
        level_manifest_path:
          type: string
          description: "位于 generated/unreal 下的生成 level assembly manifest。"
        require_imported_assets:
          type: boolean
          default: true
        require_playtest_route:
          type: boolean
          default: true
    output:
      type: object
      required:
        - status
        - validation_report
      properties:
        status:
          enum:
            - executed
            - failed
        manifest:
          type: object
        validation_report:
          type: object
          properties:
            level_manifest_path:
              type: string
            project_file:
              type: string
            map_path:
              type: string
            placement_count:
              type: integer
            issues:
              type: array
              items:
                type: string
            warnings:
              type: array
              items:
                type: string
        risks:
          type: array
          items:
            type: string
    safety:
      - "此工具不会启动 Unreal。"
      - "Level manifest 必须保持在 generated/unreal。"
      - "路线必须包含 floor、objective 和 exit 角色。"
      - "需要时，已导入资产引用必须能解析到生成工程的 Content 文件。"
  run_level_assembly:
    description: "启动 Unreal Editor 执行生成的 Fantasy Agent level assembly 脚本，并写入或更新生成的原型地图。"
    input:
      type: object
      required:
        - project_file
        - assembly_script_path
      properties:
        project_file:
          type: string
          description: "位于 generated/unreal 下的生成 .uproject 路径。"
        assembly_script_path:
          type: string
          description: "位于 generated/unreal 下的生成 Python 脚本。"
        unreal_editor_cmd:
          type: string
          default: "UnrealEditor-Cmd"
        timeout_seconds:
          type: integer
          minimum: 30
          maximum: 3600
          default: 600
        confirmed_side_effects:
          type: boolean
          description: "用户明确确认后必须为 true。"
    output:
      type: object
      required:
        - status
        - log_paths
      properties:
        status:
          enum:
            - executed
            - failed
            - blocked
        command:
          type: array
          items:
            type: string
        log_paths:
          type: array
          items:
            type: string
        return_code:
          type: integer
        stdout_tail:
          type: string
        stderr_tail:
          type: string
        risks:
          type: array
          items:
            type: string
    safety:
      - "启动 Unreal 前必须设置 confirmed_side_effects。"
      - "工程文件必须保持在 generated/unreal，并以 .uproject 结尾。"
      - "组装脚本必须保持在 generated/unreal。"
      - "日志必须保存到 generated/logs/unreal。"
  run_editor_commandlet:
    description: "运行 allowlist 内的 Unreal Editor data validation 并捕获日志。执行 editor 前先使用 manifest validation。"
    input:
      type: object
      required:
        - project_file
        - commandlet
        - timeout_seconds
      properties:
        project_file:
          type: string
          description: "位于 generated/unreal 下的生成 .uproject 路径。"
        commandlet:
          enum:
            - DataValidation
        unreal_editor_cmd:
          type: string
          default: "UnrealEditor-Cmd"
        timeout_seconds:
          type: integer
          minimum: 30
          maximum: 1800
          default: 300
        confirmed_side_effects:
          type: boolean
          description: "用户明确确认后必须为 true。"
    output:
      type: object
      required:
        - status
        - log_paths
      properties:
        status:
          enum:
            - executed
            - failed
            - blocked
        command:
          type: array
          items:
            type: string
        log_paths:
          type: array
          items:
            type: string
        return_code:
          type: integer
        stdout_tail:
          type: string
        stderr_tail:
          type: string
        risks:
          type: array
          items:
            type: string
    safety:
      - "启动 Unreal 前必须设置 confirmed_side_effects。"
      - "工程文件必须保持在 generated/unreal，并以 .uproject 结尾。"
      - "Commandlet allowlist 仅限 UE DataValidation。"
      - "Validation 日志必须保存到 generated/logs/unreal。"
safety:
      - "工程路径必须位于 workspace 内。"
      - "Commandlet 必须在 allowlist 内。"
      - "Validation 日志必须保存到 generated/logs/unreal。"
