server: comfyui-mcp
tools:
  probe_comfyui_capabilities:
    description: "发现可用的本地 ComfyUI 端点、必需 txt2img 节点、可用 checkpoint 和阻塞性配置问题。"
    input:
      type: object
      properties:
        endpoint:
          type: string
          default: "http://127.0.0.1:8188"
        endpoint_candidates:
          type: array
          items:
            type: string
          default:
            - "http://127.0.0.1:8188"
            - "http://localhost:8188"
            - "http://127.0.0.1:8001"
            - "http://localhost:8001"
        auto_discover_endpoint:
          type: boolean
          default: true
        allow_remote_endpoint:
          type: boolean
          default: false
        require_checkpoint:
          type: boolean
          default: true
        preferred_checkpoint_name:
          type:
            - string
            - "null"
    output:
      type: object
      required:
        - status
        - endpoint
        - required_nodes
        - checkpoints
        - blockers
      properties:
        status:
          enum:
            - ready
            - degraded
            - unavailable
        endpoint:
          type: string
        selected_checkpoint:
          type:
            - string
            - "null"
        required_nodes:
          type: object
        checkpoints:
          type: array
          items:
            type: string
        blockers:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
    safety:
      - "只读能力检查。"
      - "远程 ComfyUI 端点需要 allow_remote_endpoint=true。"
      - "探测期间不得提交 prompt。"
  prepare_visual_reference_workflows:
    description: "从 ComfyUIVisualPlan 准备 allowlist ComfyUI workflow JSON 文件和 run manifest。"
    input:
      type: object
      required:
        - plan
      properties:
        plan:
          $ref: "../../gameplay-schema.yaml#/$defs/comfyui_visual_plan"
        output_dir:
          type: string
          default: "generated/comfyui"
        checkpoint_name:
          type:
            - string
            - "null"
          description: "可选 checkpoint 覆盖值，会注入 API workflow 模板。"
        write_files:
          type: boolean
          default: false
    output:
      type: object
      required:
        - status
        - manifest
        - workflow_files
        - manifest_path
      properties:
        status:
          enum:
            - planned
            - written
        manifest:
          type: object
        workflow_files:
          type: array
          items:
            type: string
        written_files:
          type: array
          items:
            type: string
        manifest_path:
          type: string
    safety:
      - "除非 write_files 为 true，否则此工具只读。"
      - "Workflow 模板必须保持在 templates/comfyui。"
      - "Workflow JSON 和 manifest 必须保持在 generated/comfyui。"
      - "每个任务都必须包含 gameplay_constraint。"
  run_visual_reference_workflow:
    description: "从 ComfyUIVisualPlan 运行 allowlist 内的 ComfyUI 视觉参考任务。"
    input:
      type: object
      required:
        - plan
        - confirmed_side_effects
      properties:
        plan:
          $ref: "../../gameplay-schema.yaml#/$defs/comfyui_visual_plan"
        output_dir:
          type: string
          default: "generated/comfyui"
        checkpoint_name:
          type:
            - string
            - "null"
          description: "可选 checkpoint 覆盖值。未提供时，执行会探测本地 checkpoint，并自动选择第一个可用模型。"
        auto_discover_endpoint:
          type: boolean
          default: true
        endpoint_candidates:
          type: array
          items:
            type: string
        validate_server_capabilities:
          type: boolean
          default: true
        confirmed_side_effects:
          type: boolean
          description: "用户明确确认后必须为 true。"
        wait_for_completion:
          type: boolean
          default: false
        timeout_seconds:
          type: integer
          minimum: 10
          maximum: 1800
          default: 300
        poll_interval_seconds:
          type: number
          minimum: 0.2
          maximum: 30
          default: 2
        allow_remote_endpoint:
          type: boolean
          default: false
    output:
      type: object
      required:
        - status
        - generated_images
        - prompt_ids
        - log_paths
      properties:
        status:
          enum:
            - queued
            - executed
            - failed
            - blocked
        generated_images:
          type: array
          items:
            type: string
        manifest_path:
          type: string
        prompt_ids:
          type: array
          items:
            type: string
        written_files:
          type: array
          items:
            type: string
        log_paths:
          type: array
          items:
            type: string
        stdout_tail:
          type: string
        stderr_tail:
          type: string
    safety:
      - "默认端点必须是 localhost。"
      - "拒绝 generated/comfyui 之外的输出路径。"
      - "要求每个任务包含 gameplay_constraint。"
      - "只运行 templates/comfyui 中的模板。"
      - "必需节点或 checkpoint 模型不可用时，排队前阻塞。"
      - "提交 prompt 前必须设置 confirmed_side_effects。"
      - "生成图片成为 Unreal texture 或 UI asset 前必须经过审阅。"
