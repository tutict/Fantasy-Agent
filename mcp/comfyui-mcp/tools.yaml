server: comfyui-mcp
tools:
  probe_comfyui_capabilities:
    description: "Discover the active local ComfyUI endpoint, required txt2img nodes, available checkpoints, and blocking setup issues."
    input:
      type: object
      properties:
        endpoint:
          type: string
          default: "http://127.0.0.1:8188"
        endpoint_candidates:
          type: array
          items:
            type: string
          default:
            - "http://127.0.0.1:8188"
            - "http://localhost:8188"
            - "http://127.0.0.1:8001"
            - "http://localhost:8001"
        auto_discover_endpoint:
          type: boolean
          default: true
        allow_remote_endpoint:
          type: boolean
          default: false
        require_checkpoint:
          type: boolean
          default: true
        preferred_checkpoint_name:
          type:
            - string
            - "null"
    output:
      type: object
      required:
        - status
        - endpoint
        - required_nodes
        - checkpoints
        - blockers
      properties:
        status:
          enum:
            - ready
            - degraded
            - unavailable
        endpoint:
          type: string
        selected_checkpoint:
          type:
            - string
            - "null"
        required_nodes:
          type: object
        checkpoints:
          type: array
          items:
            type: string
        blockers:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
    safety:
      - "Read-only capability check."
      - "Remote ComfyUI endpoints require allow_remote_endpoint=true."
      - "Do not submit prompts during probing."
  prepare_visual_reference_workflows:
    description: "Prepare allowlisted ComfyUI workflow JSON files and a run manifest from a ComfyUIVisualPlan."
    input:
      type: object
      required:
        - plan
      properties:
        plan:
          $ref: "../../gameplay-schema.yaml#/$defs/comfyui_visual_plan"
        output_dir:
          type: string
          default: "generated/comfyui"
        checkpoint_name:
          type:
            - string
            - "null"
          description: "Optional checkpoint override injected into API workflow templates."
        write_files:
          type: boolean
          default: false
    output:
      type: object
      required:
        - status
        - manifest
        - workflow_files
        - manifest_path
      properties:
        status:
          enum:
            - planned
            - written
        manifest:
          type: object
        workflow_files:
          type: array
          items:
            type: string
        written_files:
          type: array
          items:
            type: string
        manifest_path:
          type: string
    safety:
      - "This tool is read-only unless write_files is true."
      - "Workflow templates must stay under templates/comfyui."
      - "Workflow JSON and manifests must stay under generated/comfyui."
      - "Every job must include a gameplay_constraint."
  run_visual_reference_workflow:
    description: "Run allowlisted ComfyUI visual reference jobs from a ComfyUIVisualPlan."
    input:
      type: object
      required:
        - plan
        - confirmed_side_effects
      properties:
        plan:
          $ref: "../../gameplay-schema.yaml#/$defs/comfyui_visual_plan"
        output_dir:
          type: string
          default: "generated/comfyui"
        checkpoint_name:
          type:
            - string
            - "null"
          description: "Optional checkpoint override. If omitted, execution probes local checkpoints and auto-selects the first available model."
        auto_discover_endpoint:
          type: boolean
          default: true
        endpoint_candidates:
          type: array
          items:
            type: string
        validate_server_capabilities:
          type: boolean
          default: true
        confirmed_side_effects:
          type: boolean
          description: "Must be true after explicit user confirmation."
        wait_for_completion:
          type: boolean
          default: false
        timeout_seconds:
          type: integer
          minimum: 10
          maximum: 1800
          default: 300
        poll_interval_seconds:
          type: number
          minimum: 0.2
          maximum: 30
          default: 2
        allow_remote_endpoint:
          type: boolean
          default: false
    output:
      type: object
      required:
        - status
        - generated_images
        - prompt_ids
        - log_paths
      properties:
        status:
          enum:
            - queued
            - executed
            - failed
            - blocked
        generated_images:
          type: array
          items:
            type: string
        manifest_path:
          type: string
        prompt_ids:
          type: array
          items:
            type: string
        written_files:
          type: array
          items:
            type: string
        log_paths:
          type: array
          items:
            type: string
        stdout_tail:
          type: string
        stderr_tail:
          type: string
    safety:
      - "Default endpoint must be localhost."
      - "Refuse output paths outside generated/comfyui."
      - "Require each job to include a gameplay_constraint."
      - "Run only templates from templates/comfyui."
      - "Block before queueing when required nodes or checkpoint models are unavailable."
      - "Require confirmed_side_effects before submitting prompts."
      - "Generated images require review before becoming Unreal textures or UI assets."
