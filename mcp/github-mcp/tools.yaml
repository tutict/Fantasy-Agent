server: github-mcp
tools:
  publish_prototype_branch:
    description: "将生成的原型产物发布到审阅分支。"
    input:
      type: object
      required:
        - branch_name
        - artifact_paths
      properties:
        branch_name:
          type: string
          pattern: "^prototype/"
        artifact_paths:
          type: array
          items:
            type: string
        pull_request_title:
          type: string
    output:
      type: object
      required:
        - branch
        - pull_request_url
      properties:
        branch:
          type: string
        pull_request_url:
          type: string
        committed_paths:
          type: array
          items:
            type: string
    safety:
      - "拒绝 .env 文件和 secret。"
      - "除非明确批准，否则拒绝生成的打包二进制文件。"
      - "Pull Request 正文必须包含 QA 摘要。"
