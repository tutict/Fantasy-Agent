server: godot-mcp
tools:
  create_godot_project_structure:
    description: "从 GodotProjectPlan 准备或写入 Godot 4 project.godot、主场景、原型脚本、资产目录和交接 manifest。"
    input:
      type: object
      required:
        - plan
      properties:
        plan:
          $ref: "../../gameplay-schema.yaml#/$defs/godot_project_plan"
        project_dir:
          type:
            - string
            - "null"
          default: "generated/godot/<project-name>"
        write_files:
          type: boolean
          default: false
    output:
      type: object
      required:
        - status
        - artifact
        - created_paths
      properties:
        status:
          enum:
            - planned
            - written
        artifact:
          type: object
        created_paths:
          type: array
          items:
            type: string
        written_files:
          type: array
          items:
            type: string
        risks:
          type: array
          items:
            type: string
    safety:
      - "除非 write_files 为 true，否则此工具只读。"
      - "工程目录必须保持在 generated/godot。"
      - "场景必须保持在 generated/godot，并以 .tscn 结尾。"
      - "脚本必须保持在 generated/godot，并以 .gd 结尾。"
  validate_godot_project:
    description: "只读校验生成的 Godot project.godot、主场景、脚本和 renderer 设置。"
    input:
      type: object
      required:
        - project_file
      properties:
        project_file:
          type: string
          description: "位于 generated/godot 下的生成 project.godot 路径。"
        require_main_scene:
          type: boolean
          default: true
        require_scripts:
          type: boolean
          default: true
    output:
      type: object
      required:
        - status
        - validation_report
      properties:
        status:
          enum:
            - executed
            - failed
        validation_report:
          type: object
          properties:
            project_file:
              type: string
            main_scene_path:
              type: string
            script_count:
              type: integer
            issues:
              type: array
              items:
                type: string
            warnings:
              type: array
              items:
                type: string
        risks:
          type: array
          items:
            type: string
    safety:
      - "此工具不会启动 Godot。"
      - "工程文件必须保持在 generated/godot，并命名为 project.godot。"
  run_godot_import:
    description: "对生成的 Fantasy Agent 工程启动 Godot headless import 并捕获日志。"
    input:
      type: object
      required:
        - project_file
      properties:
        project_file:
          type: string
          description: "位于 generated/godot 下的生成 project.godot 路径。"
        godot_executable:
          type: string
          default: "godot"
        timeout_seconds:
          type: integer
          minimum: 10
          maximum: 1800
          default: 300
        confirmed_side_effects:
          type: boolean
          description: "用户明确确认后必须为 true。"
    output:
      type: object
      required:
        - status
        - log_paths
      properties:
        status:
          enum:
            - executed
            - failed
            - blocked
        command:
          type: array
          items:
            type: string
        log_paths:
          type: array
          items:
            type: string
        return_code:
          type: integer
        stdout_tail:
          type: string
        stderr_tail:
          type: string
        risks:
          type: array
          items:
            type: string
    safety:
      - "启动 Godot 前必须设置 confirmed_side_effects。"
      - "工程文件必须保持在 generated/godot，并命名为 project.godot。"
      - "日志必须保存到 generated/logs/godot。"
safety:
      - "生成的 Godot 文件必须保持在 generated/godot。"
      - "Godot CLI 执行需要明确确认。"
      - "Godot 用于快速 playable-loop 验证，不替代 Unreal 生产导入。"
