server: blender-mcp
tools:
  generate_blender_script:
    description: "从 BlenderAssetPlan 生成 Blender Python 脚本和 Unreal import manifest。"
    input:
      type: object
      required:
        - plan
      properties:
        plan:
          $ref: "../../gameplay-schema.yaml#/$defs/blender_asset_plan"
        script_path:
          type: string
          default: "generated/blender/<job-name>.py"
        import_manifest_path:
          type: string
          default: "generated/import-manifest.yaml"
        write_files:
          type: boolean
          default: false
    output:
      type: object
      required:
        - status
        - artifact
        - written_files
      properties:
        status:
          type: string
        artifact:
          type: object
        written_files:
          type: array
          items:
            type: string
    safety:
      - "除非明确要求写入生成文件，否则此工具只读。"
      - "生成脚本只能写入 generated/。"
      - "生成脚本必须保持 Blender 执行副作用显式可见。"
  generate_asset_batch:
    description: "从 BlenderAssetPlan 运行 allowlist 内的 Blender Python 资产批处理。"
    input:
      type: object
      required:
        - plan
        - confirmed_side_effects
      properties:
        plan:
          $ref: "../../gameplay-schema.yaml#/$defs/blender_asset_plan"
        script_path:
          type: string
          default: "generated/blender/<job-name>.py"
        import_manifest_path:
          type: string
          default: "generated/import-manifest.yaml"
        blender_executable:
          type: string
          default: "blender"
        timeout_seconds:
          type: integer
          minimum: 10
          maximum: 1800
          default: 300
        confirmed_side_effects:
          type: boolean
          description: "用户明确确认后必须为 true。"
    output:
      type: object
      required:
        - status
        - exported_assets
        - import_manifest
        - log_paths
      properties:
        status:
          enum:
            - executed
            - failed
            - blocked
        exported_assets:
          type: array
          items:
            type: string
        import_manifest:
          type: string
        log_paths:
          type: array
          items:
            type: string
        return_code:
          type: integer
        stdout_tail:
          type: string
        stderr_tail:
          type: string
    safety:
      - "拒绝 generated/assets 之外的输出路径。"
      - "除非明确批准，否则拒绝 apps/blender-worker 或 generated/blender 之外的脚本。"
      - "捕获 Blender 日志用于 QA 交接。"
      - "启动 Blender 或写入导出前必须获得用户确认。"
