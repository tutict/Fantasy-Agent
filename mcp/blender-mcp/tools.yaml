server: blender-mcp
tools:
  generate_blender_script:
    description: "Generate a Blender Python script and Unreal import manifest from a BlenderAssetPlan."
    input:
      type: object
      required:
        - plan
      properties:
        plan:
          $ref: "../../gameplay-schema.yaml#/$defs/blender_asset_plan"
        script_path:
          type: string
          default: "generated/blender/<job-name>.py"
        import_manifest_path:
          type: string
          default: "generated/import-manifest.yaml"
        write_files:
          type: boolean
          default: false
    output:
      type: object
      required:
        - status
        - artifact
        - written_files
      properties:
        status:
          type: string
        artifact:
          type: object
        written_files:
          type: array
          items:
            type: string
    safety:
      - "This tool is read-only unless explicitly asked to write generated files."
      - "Generated scripts must write only under generated/."
      - "Generated scripts must keep Blender execution side effects explicit."
  generate_asset_batch:
    description: "Run an allowlisted Blender Python asset batch from a BlenderAssetPlan."
    input:
      type: object
      required:
        - plan
        - confirmed_side_effects
      properties:
        plan:
          $ref: "../../gameplay-schema.yaml#/$defs/blender_asset_plan"
        script_path:
          type: string
          default: "generated/blender/<job-name>.py"
        import_manifest_path:
          type: string
          default: "generated/import-manifest.yaml"
        blender_executable:
          type: string
          default: "blender"
        timeout_seconds:
          type: integer
          minimum: 10
          maximum: 1800
          default: 300
        confirmed_side_effects:
          type: boolean
          description: "Must be true after explicit user confirmation."
    output:
      type: object
      required:
        - status
        - exported_assets
        - import_manifest
        - log_paths
      properties:
        status:
          enum:
            - executed
            - failed
            - blocked
        exported_assets:
          type: array
          items:
            type: string
        import_manifest:
          type: string
        log_paths:
          type: array
          items:
            type: string
        return_code:
          type: integer
        stdout_tail:
          type: string
        stderr_tail:
          type: string
    safety:
      - "Refuse output paths outside generated/assets."
      - "Refuse scripts outside apps/blender-worker or generated/blender unless explicitly approved."
      - "Capture Blender logs for QA handoff."
      - "Require user confirmation before launching Blender or writing exports."
